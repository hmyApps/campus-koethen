name: campus_koethen
description: "Campus Köthen — an independent, unofficial campus app."
# Campus Köthen App · AGPL-3.0-only
# Copyright © 2026 Leviora Studio and Jona Loreen Sommer
publish_to: 'none'

version: 1.2.4+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.3

  # Routing
  go_router: ^17.2.1

  # App-wide icon system (Tabler Icons, MIT)
  flutter_tabler_icons: ^1.43.0

  # Networking
  dio: ^5.9.0
  # Imported directly for MediaType on multipart parts. Already a transitive
  # dependency of dio; declared so the import is not an implicit one.
  http_parser: ^4.1.2
  # WebDAV multistatus responses from Nextcloud are XML.
  xml: ^6.6.1

  # Content cache
  hive_ce: ^2.15.0
  hive_ce_flutter: ^2.3.4

  # Small scalar settings
  file_selector: ^1.0.3
  # Transitively present already; declared because we import it directly.
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

  # Annotations for pure-Dart domain models (@immutable)
  meta: ^1.15.0

  # Formatting / i18n
  intl: any

  # Safe OS actions for links
  url_launcher: ^6.3.2


  # Student email (IMAP/SMTP/MIME) — kept entirely behind MailGateway; no
  # enough_mail type ever reaches the UI or the Riverpod controllers.
  enough_mail: ^2.1.7

  # Credentials in the device keychain/keystore. NEVER SharedPreferences/Hive.
  flutter_secure_storage: ^10.3.1

  # Share/save downloaded mail attachments via the OS share sheet.
  share_plus: ^12.0.0

  # App version for the About screen
  package_info_plus: ^9.0.0
  # PDFium paints AcroForm fields in filled PDFs on Android and iOS.
  pdfrx: 2.4.8
  html: ^0.15.6
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9

  # Renders the bundled, generated campus map (MIT). Only ever used with local
  # assets from packages/campus-map — never with SVG from a network source.
  flutter_svg: ^2.0.10

  # Persistent disk cache for remote editorial images (RemoteImage), so a
  # cold app start does not re-download every previously-seen image.
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  app_settings: ^9.0.0
  # Native Android/iOS home-screen widget bridge. The widget UI itself remains
  # native; this only writes local payloads and requests a refresh.
  home_widget: ^0.10.0

  # PBKDF2/AES-256-GCM/RSA-OAEP for the HSA-GPT (HAWKI) chat-history keychain —
  # see lib/features/hsa_ki/crypto/. Must stay byte-compatible with HAWKI's own
  # WebCrypto-based frontend, never a "close enough" substitute.
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  # Albert Sans is bundled locally under the SIL Open Font License 1.1. The app
  # never fetches fonts at runtime.
  fonts:
    - family: AlbertSans
      fonts:
        - asset: assets/fonts/AlbertSans-Variable.ttf

  assets:
    - assets/fonts/AlbertSans-OFL.txt
    - assets/branding/
    # Generated by packages/campus-map — never edited by hand.
    - assets/maps/map_catalog.json
    - assets/maps/ratke-gebaeude/
    - assets/maps/koethen-01/
    - assets/maps/koethen-02/
    - assets/maps/koethen-03/
