packages:
  - 'apps/cms'
  - 'apps/backend'
  - 'packages/*'

# apps/mobile is intentionally NOT a pnpm workspace member.
# The Flutter app is managed by its own Dart/Flutter toolchain (pub).

# Explicit allowlist for dependency install scripts (pnpm >= 10).
# Only packages that genuinely need to compile or fetch a native binary are
# allowed to run. Telemetry/advertising postinstall scripts stay disabled.
allowBuilds:
  '@prisma/engines': true # downloads the query engine binary
  prisma: true # CLI postinstall, generates the client
  esbuild: true # native binary used by Strapi/Vite
  '@swc/core': true # native transpiler binary
  sharp: true # native image processing used by Strapi uploads
  unrs-resolver: true # native resolver binary used by eslint tooling
  '@scarf/scarf': false # analytics beacon — intentionally denied
  core-js-pure: false # postinstall advertising banner — intentionally denied

# Forward-pins for transitive dependencies with known HIGH/CRITICAL advisories.
# These come in through framework and tooling dependencies, so we cannot fix
# them all by bumping a direct dependency. Verify the resulting lockfile with
# the dependency audit and the affected builds and tests.
overrides:
  'browserslist@<=4.28.6': '4.28.7' # GHSA-c83g-rgw3-j3cx / GHSA-73wf-gq98-2v4g
  'multer@<2.4.0': '>=2.4.0 <3' # GHSA-535w-7cp7-47q4 plus aborted-upload disk-write DoS
  'tar@<7.5.21': '>=7.5.21' # GHSA-8qq5-c9xr-p97q / GHSA-r292-9mhp-454m — parse/recursion DoS
  'vite@<=6.4.2': '>=6.4.3' # server.fs.deny bypass on Windows alternate paths (high)
  'sharp@<0.35.4': '>=0.35.4' # inherited libvips/libheif CVEs, including GHSA-rgj7-g3m4-5g8c
  'find-my-way@<9.7.0': '>=9.7.0' # DDoS with HTTP/2 (high); reaches the backend image via prisma
  # Two separate js-yaml advisories, one pin per affected major line so no
  # consumer is dragged across a major boundary.
  #   5.x: exponential parsing time in flow collections (high)
  #   3.x/4.x: quadratic CPU consumption in `!!omap` resolution, CVE-2026-59870,
  #            whose fix was NOT backported below 3.15.1 / 4.3.1 (high).
  #   A later merge-key CPU advisory requires 3.15.2 / 4.3.2.
  # 3.x reaches us via jest → babel-plugin-istanbul → @istanbuljs/load-nyc-config,
  # 4.x via eslint → @eslint/eslintrc and @nestjs/cli → cosmiconfig. Both lines
  # have a patched release of their own, so neither needs a major bump.
  'js-yaml@<3.15.2': '>=3.15.2 <4' # GHSA-5p4m-2wfm-xmqj / GHSA-2883-xcg3-v3hh
  'js-yaml@>=4.0.0 <4.3.2': '>=4.3.2 <5' # GHSA-5p4m-2wfm-xmqj / GHSA-2883-xcg3-v3hh
  'js-yaml@>=5.0.0 <5.4.1': '>=5.4.1 <6'
  # DoS via unbounded expansion length. Patched releases exist on every affected
  # major line, so each stays on its own: v5 is an ESM-first rewrite and forcing
  # it onto v1/v2 consumers such as minimatch@3 would risk a runtime break.
  'brace-expansion@<1.1.20': '>=1.1.20 <2'
  'brace-expansion@>=2.0.0 <2.1.6': '>=2.1.6 <3'
  'brace-expansion@>=5.0.0 <5.0.11': '>=5.0.11 <6'
  # Host confusion via a backslash authority introducer (high). Reaches us
  # through ajv, which arrives with the prisma and nest CLIs.
  'fast-uri@>=3.0.0 <3.1.6': '>=3.1.6 <4' # GHSA-7p8r-x3mc-p8w7 / GHSA-5jgf-p345-68v8
  'mysql2@>=3.0.0 <3.22.0': '>=3.22.0 <4' # GHSA-3f6p-5ww8-9rcr; Prisma/Knex transitive driver
  # Strapi still requests nodemailer 9.x, while the maintained security fixes
  # are available only in 10.x. Its sendmail provider uses the stable
  # createTransport()/sendMail() surface; the CMS build, tests and runtime image
  # smoke-test this forward pin.
  'nodemailer@>=9.0.0 <10.0.6': '>=10.0.6 <11' # GHSA-2x7j-588g-ccc2 / GHSA-v53p-9fqp-m79j / GHSA-prgh-xp8r-p3m5
  # Framework-owned HTTP clients. All fixes stay inside the dependency's major
  # line and are covered by the Strapi unit/build/runtime gates.
  'axios@>=1.0.0 <1.20.0': '>=1.20.0 <2' # redirect and request validation advisories
  'undici@>=6.7.0 <6.28.1': '>=6.28.1 <7' # GHSA-rfgv-xxqx-mfg5
  # The installed Strapi line pins 6.1.3. The traversal fix starts at 7.4.5,
  # and a second advisory (CVE-2026-76844) was only fixed in 7.4.6; this is a
  # development middleware and is exercised by the CMS build/test gates.
  'webpack-dev-middleware@>=6.0.0 <7.4.6': '>=7.4.6 <8' # GHSA-g84c-rxfj-3j2c / CVE-2026-76844
  # Address4 reads a leading-zero octet as decimal where resolvers read octal,
  # which is an SSRF and trust-boundary bypass (high). Comes in under Strapi.
  # Only the 10.x line is installed, so the pin cannot disturb an older major.
  'ip-address@>=10.0.0 <10.3.1': '>=10.3.1' # GHSA-mwp4-54f8-5fhr
  # A custom generator called with size 0 loops forever (high). Arrives under
  # postcss, which webpack/vite pull in for the Strapi admin build and the nest
  # CLI. Only the 3.x line is installed, so the pin cannot disturb another major.
  'nanoid@<3.3.18': '>=3.3.18 <4' # GHSA-2v37-7h3g-55p8
  # Strapi's admin/content-type tooling currently pins vulnerable patch
  # releases. All three fixes stay on the same major and preserve the public
  # dependency contracts used by their parent packages.
  '@hono/node-server@<1.19.15': '>=1.19.15 <2' # GHSA-frvp-7c67-39w9
  'hono@<4.13.7': '>=4.13.7 <5' # query, traversal, nesting and JSX escaping advisories
  'postcss@<=8.5.22': '>=8.5.23 <9' # GHSA-fxqj-rqcc-2cmp
  # Patch/minor-only forward pins for CMS build and admin dependencies. These
  # remain on each package's current major and are covered by CMS tests/build.
  'baseline-browser-mapping@<2.11.0': '>=2.11.0 <3'
  'dompurify@>=3.0.0 <3.4.16': '>=3.4.16 <4'
  'markdown-it@>=14.0.0 <14.3.1': '>=14.3.1 <15'
  'qs@>=6.0.0 <6.16.0': '>=6.16.0 <7'
  # Stack exhaustion when merging recursive object graphs (high). Comes in under
  # @prisma/config, which ships with prisma and therefore reaches the backend
  # image. The patch is only on the new major; 8.0.1 is a strict superset of the
  # 7.1.5 export surface (deepmerge, deepmergeCustom, deepmergeInto,
  # deepmergeIntoCustom, getKeys, getObjectType, objectHasProperty), keeps the
  # same dual CJS/ESM entry points and the same `node >=16` engine range, and
  # @prisma/config only ever calls `deepmerge`. Verified against both packages.
  'deepmerge-ts@<8.0.0': '>=8.0.0' # GHSA-ggr8-5vv4-36mx

# Advisories that are assessed and handled, but whose published range cannot
# express the fix. Reviewed on every dependency change — never a blanket mute.
auditConfig:
  ignoreGhsas:
    # brace-expansion — DoS via unbounded expansion length (CVE-2026-14257).
    #
    # The advisory declares a single major-spanning range, "<=5.0.7 vulnerable,
    # >=5.0.8 patched", so it still matches the BACKPORTED releases. The fix is
    # demonstrably present in what we install: 1.1.20 carries EXPANSION_MAX_LENGTH
    # and the bounding check, citing this very CVE. The overrides above pin every
    # major line to its patched release, so a lower version cannot come back.
    #
    # Upgrading everything to 5.x instead is NOT an option: v5 is an ESM-first
    # rewrite whose CommonJS entry exports `{ expand }` rather than the function
    # itself, so minimatch@3 — which calls the default export — would break at
    # runtime. Verified by requiring the built package directly.
    #
    # All 130 paths are devDependencies (eslint, jest, @nestjs/cli); none reach a
    # production image.
    - GHSA-mh99-v99m-4gvg
    # braces 3.0.3 has no published fixed release. The maintained patch below
    # rejects more than 100 nested braces or parentheses before the recursive
    # walkers run. The CMS test resolves Strapi's installed copy and checks both
    # paths. The audit sees the upstream version, not our patch; remove this
    # one-advisory exception when a fixed release is published.
    - GHSA-vfj7-8cjw-p6xm

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
