# Campus Köthen test API — deployable Nginx virtual host.
#
# Install as:
#   /etc/nginx/conf.d/campus-test-api.erikspace.eu.conf
#
# Prerequisite: the shared certificate described in ./README.md exists at
# /etc/letsencrypt/live/campus-koethen-test/. The upstream port matches
# API_HOST_PORT in ../campus-test-api.example. No placeholder remains.

# Shared zones, upstream pools and the media cache live in the required
# companion file campus-shared-capacity.conf.

# Keep the ACME webroot reachable for automatic certificate renewal; redirect
# everything else to HTTPS.
server {
    listen 80;
    server_name campus-test-api.erikspace.eu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name campus-test-api.erikspace.eu;

    # Keep the Campus rate-limit response and logging policy scoped to this
    # virtual host so unrelated Nginx services retain their own defaults.
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level notice;

    ssl_certificate /etc/letsencrypt/live/campus-koethen-test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus-koethen-test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # The API is READ-ONLY. No endpoint accepts a body, so anything larger than
    # a stray header is refused before it is read.
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # The upstream announces nothing about itself; neither should this hop.
    server_tokens off;

    # Rejected bursts tell clients that a short retry is appropriate instead
    # of looking like a permanent application error.
    error_page 429 = @campus_rate_limited;
    location @campus_rate_limited {
        add_header Retry-After 2 always;
        return 429;
    }

    # Default deny. A path that is not listed below does not exist from
    # outside.
    location / {
        return 404;
    }

    location /v1/ {
        # One public campus NAT may represent most of the 3,000 students. Its
        # limit is therefore intentionally much looser than the global server
        # limit. The global bucket accepts a large burst immediately, then
        # smooths the remainder for at most roughly eight seconds.
        limit_req zone=campus_api_per_nat burst=12000 nodelay;
        limit_req zone=campus_api_global burst=6000 delay=1200;
        limit_conn campus_conn_per_nat 3000;
        limit_conn campus_conn_global 4000;

        # The API answers GET only; rejecting the rest here keeps it out of the
        # Node process entirely.
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        proxy_pass http://campus_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Above the API's own Strapi timeout (10s) plus its bounded retries, so
        # a slow-but-working upstream is not cut off — and well below a
        # connection that has simply hung.
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # The API sets its own security headers on every response, including
        # the bytes the media endpoint sends. Nothing is added or overridden
        # here — two sources for the same header is how they drift apart.
    }

    # Tighter budget for the one path that moves real bytes.
    location /v1/media/ {
        limit_req zone=campus_media_per_nat burst=1000 nodelay;
        limit_req zone=campus_media_global burst=600 delay=120;
        limit_conn campus_conn_per_nat 500;
        limit_conn campus_conn_global 750;

        limit_except GET HEAD OPTIONS {
            deny all;
        }

        proxy_pass http://campus_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache campus_media_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # The edge decides how long an answer is kept, not the upstream header:
        # nginx otherwise prefers Cache-Control/Expires over proxy_cache_valid,
        # and one upstream error carrying a long max-age was kept for a day.
        # Only these two statuses are stored; everything else passes through.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 24h;
        proxy_cache_valid 404 1m;
        add_header X-Campus-Cache $upstream_cache_status always;
    }

    # Probes: reachable, unlogged, and not worth rate limiting into uselessness.
    location = /health/live {
        access_log off;
        limit_req zone=campus_health_per_nat burst=100 nodelay;
        limit_req zone=campus_health_global burst=200 nodelay;
        limit_conn campus_conn_per_nat 100;
        limit_conn campus_conn_global 200;
        proxy_pass http://campus_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /health/ready {
        access_log off;
        limit_req zone=campus_health_per_nat burst=100 nodelay;
        limit_req zone=campus_health_global burst=200 nodelay;
        limit_conn campus_conn_per_nat 100;
        limit_conn campus_conn_global 200;
        proxy_pass http://campus_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Swagger UI and the OpenAPI document.
    #
    # Public by deliberate decision (Erik, LEVIORA-180): the API is a public
    # read-only contract, so the page documenting it belongs in the open. The
    # backend must have DOCS_ENABLED=true for this to answer at all — the edge
    # only decides whether the path is reachable, not whether it exists.
    #
    # The prefix match is required, not cosmetic: Swagger UI loads its own
    # bundle and stylesheet from under /docs/.
    #
    # Its own rate-limit budget because it is HTML plus assets rather than a
    # JSON answer, and because a documentation page has no reason to be hit at
    # app frequency.
    location /docs {
        limit_req zone=campus_docs_per_nat burst=500 nodelay;
        limit_req zone=campus_docs_global burst=250 delay=50;
        limit_conn campus_conn_per_nat 300;
        limit_conn campus_conn_global 500;

        limit_except GET HEAD OPTIONS {
            deny all;
        }

        proxy_pass http://campus_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
