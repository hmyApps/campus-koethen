# Nginx main configuration for the Campus Koethen VPS.
#
# This file keeps the standard Debian/Ubuntu include locations, so unrelated
# virtual hosts in conf.d or sites-enabled remain active. Back up an existing
# /etc/nginx/nginx.conf and review local additions before replacing it.

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /dev/null;

include /etc/nginx/modules-enabled/*.conf;

events {
    # A proxied request can occupy one client and one upstream connection.
    # 16384 per worker therefore leaves ample headroom for 3,000 students while
    # still imposing a finite resource ceiling.
    worker_connections 16384;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time '
                    'urt=$upstream_response_time limit=$limit_req_status '
                    'cache=$upstream_cache_status "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log off;
    error_log /dev/null;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keep client connections reusable, but not indefinitely. This reduces TLS
    # and socket churn when the app opens several screens in a short burst.
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;

    types_hash_max_size 2048;
    server_tokens off;

    # Shared TLS sessions reduce repeated handshake work for returning devices.
    ssl_session_cache shared:campus_tls:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript application/xml text/css text/plain;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
